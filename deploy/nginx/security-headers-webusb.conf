# /etc/nginx/snippets/security-headers-webusb.conf on the server: the shared
# security-headers.conf with ONE difference, usb=(self) in place of usb=() in
# Permissions-Policy, so that the web installer at /install/web/app/ may use
# WebUSB on its own origin. Included only by the location in
# omamobile.org-install-web-app.conf, never by any other site or path.
#
# A replacement, not an addition: a second Permissions-Policy header next to
# the shared one would leave which value a browser keeps to its parser, and
# an addition cannot loosen what the shared one forbids. Keep every other line
# the same as security-headers.conf; if that file changes, change this one in
# the same sitting (docs/INSTALLER-WEB.md, "Keeping the two snippets equal").
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(self)" always;

# The shared snippet's CSP, unchanged: the installer fetches releases from
# https://pkgs.omamobile.org (connect-src https:) and compiles its
# WebAssembly ('wasm-unsafe-eval'); frame-ancestors 'self' keeps other
# origins from framing it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
