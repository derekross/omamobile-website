# The location to add to the omamobile.org server block (port 443) in
# /etc/nginx/sites-available/omamobile.org, above `location / { ... }`.
# By hand, by the maintainer, with sudo: docs/INSTALLER-WEB.md, "The header".
#
# ^~ is load-bearing. Without it the vhost's regex locations (/assets/ js and
# css, images, .json) would win for the installer's files and send the shared
# usb=() snippet; with it, every request under /install/web/app/ ends here.
# It only ever sends the installer's own files: try_files falls back to 404,
# not to the site's /index.html as the SPA location does, so a request for a
# file the installer does not have never gets a page with usb=(self).
location ^~ /install/web/app/ {
    include /etc/nginx/snippets/security-headers-webusb.conf;

    # Not content-hashed (index.html, app.js, pkg/*.wasm keep their names
    # from release to release), so never cached: a deploy is live at once.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # The vhost's dotfile and backup-file denies are regex locations, which
    # ^~ skips: the same here (the deploy refuses an archive with dotfiles too)
    location ~ /\. { deny all; }
    location ~* \.(env|bak|old|orig|swp|sql)$ { deny all; }

    try_files $uri $uri/ =404;
}
